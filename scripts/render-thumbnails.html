<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Thumbnail Renderer</title>
<style>body { margin: 0; background: transparent; }</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three"
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"

const SIZE = 256

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
renderer.setSize(SIZE, SIZE)
renderer.setPixelRatio(2)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.0
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = null

// Hemisphere + key + fill — soft product-catalog look
scene.add(new THREE.HemisphereLight(0xffffff, 0xe0e0e0, 0.7))
const key = new THREE.DirectionalLight(0xffffff, 1.4)
key.position.set(3, 5, 4)
scene.add(key)
const fill = new THREE.DirectionalLight(0xffffff, 0.5)
fill.position.set(-3, 2, -2)
scene.add(fill)

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100)

const loader = new GLTFLoader()

function loadModel(url) {
  return new Promise((resolve, reject) => {
    loader.load(url, (gltf) => resolve(gltf.scene), undefined, reject)
  })
}

function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object)
  const size = box.getSize(new THREE.Vector3())
  const center = box.getCenter(new THREE.Vector3())

  // Re-center object at origin on the floor
  object.position.sub(center)
  object.position.y += size.y / 2

  const maxDim = Math.max(size.x, size.y, size.z)
  const fov = camera.fov * (Math.PI / 180)
  const distance = (maxDim / 2) / Math.tan(fov / 2) * 1.8

  // 3/4 angled view — slightly elevated, diagonal
  camera.position.set(distance * 0.7, distance * 0.6, distance * 0.8)
  camera.lookAt(0, size.y / 2, 0)
  camera.updateProjectionMatrix()
}

window.renderThumbnail = async function(url) {
  // Clear previous models
  for (let i = scene.children.length - 1; i >= 0; i--) {
    const child = scene.children[i]
    if (child.type === "Group" || child.type === "Object3D" || child.isMesh) {
      scene.remove(child)
    }
  }

  const model = await loadModel(url)
  scene.add(model)
  frameObject(model)

  renderer.render(scene, camera)
  return renderer.domElement.toDataURL("image/png")
}

window.__ready = true
</script>
</body>
</html>
